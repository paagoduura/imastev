name: Deploy Supabase Edge Functions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        working-directory: skin-sense-buddy-main
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase deployment is not configured. Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in GitHub Actions secrets." >&2
            exit 1
          fi

          # Accept either the raw project ref or a copied Supabase URL, then validate
          # the normalized 20-character ref before invoking the CLI.
          PROJECT_ID="$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]' | sed -E 's#^https?://##; s#\.supabase\.co/?$##; s#/$##')"
          if ! printf '%s' "$PROJECT_ID" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "SUPABASE_PROJECT_REF must be the 20-character Supabase project ref, not a project name or unrelated key." >&2
            exit 1
          fi

          supabase functions deploy --project-ref "$PROJECT_ID" --no-verify-jwt
